name: 🐻 百度贴吧 [签到]
description: |-
  每日定时签到｜Egern原生版
  打开百度贴吧APP点击"我的"即可获取Cookie.
  支持开关Cookie获取，可自定义签到时间。
compat_arguments:
  sign_cron: '30 0,12 * * *'
compat_arguments_schema:
  sign_cron:
    name: 签到时间
    description: Cron表达式，默认每天 0:30 和 12:30 签到
    default_value: '30 0,12 * * *'
env:
  COOKIE_ENABLED: 'true'
env_schema:
  COOKIE_ENABLED:
    name: 获取Cookie
    description: 关闭后不再抓取Cookie（需先打开一次贴吧App获取Cookie）
    options:
    - 'true'
    - 'false'
author: mickeu 修改为Egern版
icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/CN_01.png
dns: {}

scriptings:
  - http_request:
      name: '百度贴吧[Cookie]'
      match: '^https?://(c\.tieba|tiebac)\.baidu\.com/c/s/login'
      script_url: 'https://raw.githubusercontent.com/mickeu/Egern/main/TieBa.js'
      timeout: 60
  - schedule:
      name: '百度贴吧[签到]'
      cron: '{{{sign_cron}}}'
      script_url: 'https://raw.githubusercontent.com/mickeu/Egern/main/TieBa.js'
      timeout: 600
      update_interval: 0

mitm:
  hostnames:
    includes:
      - c.tieba.baidu.com
      - tiebac.baidu.com