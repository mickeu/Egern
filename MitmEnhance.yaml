#!name=自定义MITM解密模块
#!desc=在此处添加需要解密的域名
#!icon=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/06jichang/mitce.png

mitm:
  ca_p12: Surge Generated CA 0EA5F8E8.p12
  ca_passphrase: 0EA5F8E8
  hostnames:
    # 1. 在 includes 下方添加你需要解密的域名
    includes:
      - '*.example.com'
      - 'api.target.com'
    # 2. 在 excludes 下方保持你想要排除（不解密）的域名
    excludes:
      - '*.github.com'
      - '*.githubusercontent.com'
