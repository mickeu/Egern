name: PingMe Auto CheckIn
description: PingMe daily check-in + video bonus, multi-account support
icon: https://raw.githubusercontent.com/axhani/icon/refs/heads/main/pingme&wetalk.png
dns: {}
scriptings:
- http_request:
    name: PingMe账号抓取
    match: ^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus
    script_url: https://raw.githubusercontent.com/mickeu/Egern/refs/heads/main/PingMe_capture.js
    timeout: 60
- schedule:
    name: PingMe签到
    cron: 00 */3 * * *
    script_url: https://raw.githubusercontent.com/mickeu/Egern/refs/heads/main/PingMe_task.js
    timeout: 240
mitm:
  hostnames:
    includes:
    - api.pingmeapp.net