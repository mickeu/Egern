name: PingMe签到
description: PingMe 自动化签到+视频奖励（fmz200版）
compat_arguments:
  arg1: 'true'
  arg2: 'true'
  arg3: 0 8,20 * * *
  PROXY: PROXY
compat_arguments_schema:
  arg1:
    name: PingMe任务
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  arg2:
    name: PMtoken
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  arg3:
    name: PM定时
    default_value: 0 8,20 * * *
  PROXY:
    name: PROXY
    description: 代理规则使用的策略
    default_value: PROXY
author: mickeu 修改为Egern版
icon: https://raw.githubusercontent.com/axhani/icon/refs/heads/main/pingme&wetalk.png
dns: {}
rules:
- domain:
    match: api.pingmeapp.net
    policy: PROXY
scriptings:
- schedule:
    name: PingMe签到
    cron: 30 8,20 * * *
    script_url: https://raw.githubusercontent.com/fmz200/wool_scripts/main/Scripts/PingMe/PingMeSignin.js
    timeout: 300
- http_request:
    name: PingMe获取签到参数
    match: ^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus
    script_url: https://raw.githubusercontent.com/fmz200/wool_scripts/main/Scripts/cookie/get_cookie.js
    timeout: 60
mitm:
  hostnames:
    includes:
    - api.pingmeapp.net