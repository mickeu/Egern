name: PingMe签到
description: 😀 新增PingMe签到 | 🤫 支持获取签到参数和每日签到&任务 | 🤫 原作者 @ZenMoFiShi | mickeu修改为支持 🎈Egern | 😀 测试了Egern，其他平台报错反馈
compat_arguments:
  PROXY: PROXY
compat_arguments_schema:
  PROXY:
    name: PROXY
    description: 代理规则使用的策略
    default_value: PROXY
    options:
    - PROXY
    - DIRECT
    - 手动选择
    - 自动选择
    - 故障转移
    - 负载均衡
env:
  PINGME_CAPTURE: 'true'
env_schema:
  PINGME_CAPTURE:
    name: PM'token
    description: 关闭后不再抓取签到参数
    default_value: 'true'
    options:
    - 'true'
    - 'false'
author: mickeu 修改为Egern版
icon: https://raw.githubusercontent.com/axhani/icon/refs/heads/main/pingme&wetalk.png
dns: {}
rules:
- domain:
    match: api.pingmeapp.net
    policy: PROXY
scriptings:
- schedule:
    name: PingMe签到
    cron: 30 8,20 * * *
    script_url: https://raw.githubusercontent.com/mickeu/Egern/main/PingMeSignin.js
    timeout: 300
- http_request:
    name: PingMe获取签到参数
    match: ^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus
    script_url: https://raw.githubusercontent.com/mickeu/Egern/main/pingme_capture.js
    timeout: 60
mitm:
  hostnames:
    includes:
    - api.pingmeapp.net